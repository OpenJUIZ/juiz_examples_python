# 同じ画像処理 (読み込み → 縮小 → 二値化 → 白い画素の割合) を 2 通りに組む。
#   1. Composite: 4 つの Process を 1 つの Process の型 (image_pipeline_python) にまとめる
#   2. 接続: 4 つの Process を別々に置き、Pull 接続でつなぐ
name: image_pipeline
option:
  http_broker:
    start: true
    port: 8000
plugins:
  process_factories:
    image_load_python:
      language: python
      path: "./process"
    image_resize_python:
      language: python
      path: "./process"
    image_binarize_python:
      language: python
      path: "./process"
    image_white_ratio_python:
      language: python
      path: "./process"

# 1. Composite。body は式の木で、根の Process の引数に子の Process の戻り値を渡す。
#    args に書かなかった引数 (path, width, height, threshold) は、そのままの名前で Composite の引数になる。
composites:
  - type_name: image_pipeline_python
    description: "画像を読み込んで縮小・二値化し、白い画素の割合を返す"
    body:
      process: image_white_ratio_python
      args:
        img:
          process: image_binarize_python
          args:
            img:
              process: image_resize_python
              args:
                img:
                  process: image_load_python

processes:
  # 1. Composite のインスタンス。普通の Process と同じように置いて呼べる
  - type_name: image_pipeline_python
    name: pipeline0
  # 2. 接続で組む版。段ごとに Process のインスタンスを置く
  #    (use_memo: false は、前回の結果を使い回さず毎回計算し直すため。時間を比べるときに必要)
  - type_name: image_load_python
    name: load0
    use_memo: false
  - type_name: image_resize_python
    name: resize0
    use_memo: false
  - type_name: image_binarize_python
    name: binarize0
    use_memo: false
  - type_name: image_white_ratio_python
    name: ratio0
    use_memo: false

# 2. Pull 接続: ratio0 を呼ぶと、上流の binarize0 → resize0 → load0 が順に呼ばれる
connections:
  - connection_type: Pull
    source: { type_name: image_load_python, name: load0 }
    destination: { type_name: image_resize_python, name: resize0 }
    arg_name: img
  - connection_type: Pull
    source: { type_name: image_resize_python, name: resize0 }
    destination: { type_name: image_binarize_python, name: binarize0 }
    arg_name: img
  - connection_type: Pull
    source: { type_name: image_binarize_python, name: binarize0 }
    destination: { type_name: image_white_ratio_python, name: ratio0 }
    arg_name: img
