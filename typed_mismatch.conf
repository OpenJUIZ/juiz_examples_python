name: typed_mismatch
# 型の合わない接続の例。twist0 は Twist2D を出すが、move0 の引数 pose は Pose2D なので、
# juiz は接続を作らずにエラー (TypeIncompatibleError) を出す。
option:
  http_broker:
    start: true
    port: 8000
  pythonpath: ["../gen"]
plugins:
  process_factories:
    twist_python:
      language: python
      path: "./process"
    pose_move_python:
      language: python
      path: "./process"
processes:
  - type_name: twist_python
    name: twist0
  - type_name: pose_move_python
    name: move0
connections:
  - name: twist_to_pose
    connection_type: Pull
    source:
      name: twist0
      type_name: twist_python
    destination:
      name: move0
      type_name: pose_move_python
    arg_name: pose
