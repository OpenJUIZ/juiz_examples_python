name: chatter_base
plugins:
  process_factories:
    talker_python:
      language: python
      path: "./python"
processes:
  - type_name: talker_python
    name: talker0
    publishes: [chatter]
    p_apply:
      message: "Hello from chatter_base"
ecs:
  - name: ec0
    type_name: main_loop_ec
    rate: 1.0
    bind:
      - name: talker0
        type_name: talker_python
    auto_start: true
