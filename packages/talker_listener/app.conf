name: talker_listener
option:
  http_broker:
    start: true
    port: 8000
plugins:
  process_factories:
    talker_python:
      language: python
      path: "./python"
    listener_python:
      language: python
      path: "./python"
processes:
  - type_name: talker_python
    name: talker0
  - type_name: listener_python
    name: listener0
connections:
  - name: con0
    connection_type: Push
    source:
      name: talker0
      type_name: talker_python
    destination:
      name: listener0
      type_name: listener_python
    arg_name: arg1
ecs:
  - name: ec0
    type_name: main_loop_ec
    rate: 1.0
    bind:
      - name: talker0
        type_name: talker_python
    auto_start: true
