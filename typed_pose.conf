name: typed_pose
# サンプル共通の型 (types/geometry.jidl) を使い、型付きの値を受け渡す。
#   twist0 (Twist2D を出す) --Pull--> move0 の引数 twist
#   move0 (Pose2D を出す) --Push--> print0 の引数 pose
# 先に juiz idl -g python -o gen types/geometry.jidl で型を作っておく。
option:
  http_broker:
    start: true
    port: 8000
  # Python のプラグインの場所 (./process) から見た、Python の型 (gen/) の場所
  pythonpath: ["../gen"]
plugins:
  process_factories:
    twist_python:
      language: python
      path: "./process"
    pose_move_python:
      language: python
      path: "./process"
    pose_print_python:
      language: python
      path: "./process"
processes:
  - type_name: twist_python
    name: twist0
  - type_name: pose_move_python
    name: move0
  - type_name: pose_print_python
    name: print0
connections:
  - name: twist_to_move
    connection_type: Pull
    source:
      name: twist0
      type_name: twist_python
    destination:
      name: move0
      type_name: pose_move_python
    arg_name: twist
  - name: move_to_print
    connection_type: Push
    source:
      name: move0
      type_name: pose_move_python
    destination:
      name: print0
      type_name: pose_print_python
    arg_name: pose
