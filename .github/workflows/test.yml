name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: juiz-cli をインストールする
        run: pip install -r requirements.txt
      - name: サンプルを動かして結果を確かめる
        run: python tests/test_examples.py
