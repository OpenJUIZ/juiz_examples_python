name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # データ型のサンプルのため、公開までは requirements.txt が juiz-cli を juiz の main のコミットからビルドする
      # (Rust が要る)。公開後はこの手順を外す
      - uses: dtolnay/rust-toolchain@stable
      - name: juiz-cli をインストールする
        run: pip install -r requirements.txt
      - name: サンプルを動かして結果を確かめる
        run: python tests/test_examples.py
        env:
          PYTHONIOENCODING: utf-8
